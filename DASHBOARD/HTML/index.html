<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD</title>
    <link rel="stylesheet" href="/DASHBOARD/CSS/dashboard.css">
</head>
<body>
    <!-- Barra Superior -->
    <header class="cabecalho">
        <h1 class="titulo">Gerenciamento do Sistema</h1>
        <button id="BTN_sair" class="BTN_sair">
            SAIR
        </button>
    </header>
    <!-- Dashboard -->
    <main class="dashboard">
        <h2 class="BEMVINDO">
            Seja bem vindo
        </h2>
        <!-- Opções do Sistema -->
        <div class="cards">
            <button class="card" onclick="abrirClientes()">
                <p style="font-size: 80px;">🫂</p>
                <h3>Clientes</h3>
                <p>Cadastro dos Clientes</p>
            </button>
            <button class="card">
                <p style="font-size: 80px;">🏢</p>
                <h3>Fornecedores</h3>
                <p>Cadastro de Fornecedores</p>
            </button>
            <button class="card" onclick="abrirFuncionarios()">
                <p style="font-size: 80px;">🧑‍💼</p>
                <h3>Funcionários</h3>
                <p>Cadastro de Funcionários</p>
            </button>
            <button class="card" onclick="abrirProdutos()">
                <p style="font-size: 80px;">🎣/🦌</p>
                <h3>Produtos</h3>
                <p>Cadastro de Produtos</p>
            </button>
            <button class="card" onclick="abrirManutencao()">
                <p style="font-size: 80px;">⚙️</p>
                <h3>Manutenção</h3>
                <p>Manutenção de Sistema</p>
            </button>
        </div>
    </main>

    <script type="text/javascript" src="/js/dashboard.js"></script>
</body>
</html>
