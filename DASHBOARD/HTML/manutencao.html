<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção</title>
    <link rel="stylesheet" href="/DASHBOARD/CSS/manutencao.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-textos">
            <h1 class="titulo">Manutenção</h1>
            <h3 class="descricao">Registro e acompanhamento de manutenções</h3>
        </div>
        <button class="BTN_voltar" id="BTN_voltar" type="button" onclick="voltarDashboard()">
            Dashboard
        </button>
    </header>
 
    <main>
        <!-- Resumo -->
        <section class="resumo" aria-label="Resumo das manutenções">
            <div class="resumo-item">
                <span class="resumo-numero" id="totalPendente">0</span>
                <span class="resumo-label">Pendentes</span>
            </div>
            <div class="resumo-item">
                <span class="resumo-numero" id="totalAndamento">0</span>
                <span class="resumo-label">Em andamento</span>
            </div>
            <div class="resumo-item">
                <span class="resumo-numero" id="totalConcluida">0</span>
                <span class="resumo-label">Concluídas</span>
            </div>
            <div class="resumo-item">
                <span class="resumo-numero" id="totalCusto">R$ 0,00</span>
                <span class="resumo-label">Custo total</span>
            </div>
        </section>
 
        <!-- Formulário -->
        <section class="cadastro">
            <h2 id="tituloFormulario">Nova manutenção</h2>
 
            <form id="formManutencao" novalidate>
                <input type="hidden" id="id">
 
                <div class="grade">
                    <div class="input-group">
                        <label for="equipamento">Equipamento / Item:</label>
                        <input type="text" id="equipamento" required placeholder="Ex.: Compressor 02">
                    </div>
 
                    <div class="input-group">
                        <label for="tipo">Tipo:</label>
                        <select id="tipo" required>
                            <option value="" disabled selected>Selecione o tipo</option>
                            <option value="Preventiva">Preventiva</option>
                            <option value="Corretiva">Corretiva</option>
                            <option value="Preditiva">Preditiva</option>
                        </select>
                    </div>
 
                    <div class="input-group">
                        <label for="responsavel">Responsável:</label>
                        <input type="text" id="responsavel" required placeholder="Nome do técnico ou empresa">
                    </div>
 
                    <div class="input-group">
                        <label for="data">Data:</label>
                        <input type="date" id="data" required>
                    </div>
 
                    <div class="input-group">
                        <label for="custo">Custo (R$):</label>
                        <input type="number" id="custo" min="0" step="0.01" required placeholder="0,00">
                    </div>
 
                    <div class="input-group">
                        <label for="status">Status:</label>
                        <select id="status" required>
                            <option value="Pendente">Pendente</option>
                            <option value="Em andamento">Em andamento</option>
                            <option value="Concluída">Concluída</option>
                        </select>
                    </div>
 
                    <div class="input-group input-group--cheio">
                        <label for="descricao">Descrição do serviço:</label>
                        <textarea id="descricao" rows="3" placeholder="O que foi ou será feito?"></textarea>
                    </div>
                </div>
 
                <p class="erro" id="mensagemErro" role="alert" hidden></p>
 
                <div class="BTNs">
                    <button class="btn-salvar" type="submit" id="btnSalvar">Salvar manutenção</button>
                    <button type="button" class="btn-limpar" onclick="limparFormulario()">Novo</button>
                </div>
            </form>
        </section>
 
        <!-- Listagem -->
        <section class="listar-manutencoes">
            <div class="listar-topo">
                <h2 class="h2">Manutenções cadastradas</h2>
                <input type="search" id="busca" class="busca" placeholder="Buscar por equipamento ou responsável"
                       aria-label="Buscar manutenções">
            </div>
 
            <div class="tabela-wrapper">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Equipamento</th>
                            <th>Tipo</th>
                            <th>Responsável</th>
                            <th>Data</th>
                            <th>Custo</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
        </section>
    </main>
 
    <script src="/DASHBOARD/JS/manutencao.js"></script>
</body>
</html>
