<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos</title>
    <link rel="stylesheet" href="/DASHBOARD/CSS/abas.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-textos">
            <h1 class="titulo">Cadastro de Produtos</h1>
            <h3 class="descricao">Cadastro Manual de Produtos</h3>
        </div>
        <button class="BTN_voltar" id="BTN_voltar" type="button" onclick="voltarDashboard()">
            Dashboard
        </button>
    </header>
    <main>
        <section class="cadastro">
            <h2>Dados do Produto</h2>
            <form id="formProduto">
                <div class="grade">
                    <input type="hidden" id="id">
                    <div class="input-group">
                        <label for="id">ID:</label>
                        <input type="number" id="id" min="1" step="1"
                            required placeholder="Digite o ID do produto">
                    </div>
                    <div class="input-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" required placeholder="Digite o nome do produto">
                    </div>
                    <div class="input-group">
                        <label for="categoria">Categoria:</label>
                        <input type="text" id="categoria" required placeholder="Digite a categoria do produto">
                    </div>
                    <div class="input-group">
                        <label for="sub-categoria">Sub-categoria:</label>
                        <textarea id="sub-categoria" class="descricao-produto"
                            placeholder="Digite a sub-categoria do produto"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="badge">Badge:</label>
                        <input type="text" id="badge" required placeholder="Digite a badge do produto">
                    </div>
                    <div class="input-group">
                        <label for="resumo">Resumo:</label>
                        <input type="text" id="resumo" required placeholder="Digite um resumo do produto">
                    </div>
                    <div class="input-group">
                        <label for="descricao">Descrição:</label>
                        <textarea id="descricao" class="descricao-produto"
                            placeholder="Digite a descrição do produto"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="preco">Preço:</label>
                        <input type="number" min="0" value="0" step="0.01"
                            id="preco" required placeholder="Digite o preço do produto">
                    </div>
                    <div class="input-group">
                        <label for="parcela">Parcelas:</label>
                        <input type="number" min="0" value="0" step="1"
                            id="parcela" required placeholder="Digite a quantidade de parcelas">
                    </div>
                    <div class="input-group">
                        <label for="estoque">Estoque:</label>
                        <input type="number" min="0" step="1"
                            id="estoque" required placeholder="Digite o estoque do produto">
                    </div>
                    <div class="input-group">
                        <label for="imagem">Imagem:</label>
                        <input type="file" accept="image/*" id="imagem" required>
                    </div>
                    <div class="input-group">
                        <label for="status">Status do produto:</label>
                        <select id="status" class="status" required>
                            <option value="" selected disabled>Selecione o status</option>
                            <option value="disponivel">Disponível</option>
                            <option value="indisponivel">Indisponível</option>
                            <option value="descontinuado">Descontinuado</option>
                        </select>
                    </div>
                </div>
                <div class="BTNs">
                    <button class="btn-salvar" type="submit">
                        Salvar Produto
                    </button>
                    <button type="button" class="btn-limpar" onclick="limparFormulario()">
                        Novo
                    </button>
                </div>
            </form>
        </section>

        <section class="listar-produtos">
            <h2 class="h2">Produtos Cadastrados</h2>
            <table class="tabela">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Sub-categoria</th>
                        <th>Badge</th>
                        <th>Resumo</th>
                        <th>Descrição</th>
                        <th>Preço</th>
                        <th>Parcelas</th>
                        <th>Estoque</th>
                        <th>Imagem</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
        </section>
    </main>

    <script src="/DASHBOARD/JS/produtos.js"></script>
</body>
</html>
