<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos</title>
    <link rel="stylesheet" href="/DASHBOARD/CSS/produtos.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="titulo">Cadastro de Produtos</h1>
        <h3 class="descricao">Cadastro Manual de Produtos</h3>
        <button class="BTN_voltar" id="BTN_voltar" type="button" onclick="voltarDashboard()">
            Dashboard
        </button>
    </header>
    <main>
        <section>
            <h2>Dados do Produto</h2>
            <!-- Formulário de Cadastro -->
            <div class="cadastro">
                <form id="formProduto">
                    <input type="hidden" id="id">
                    <div class="input-group">
                        <label>Nome:</label>
                        <br>
                        <input type="text" id="nome" required placeholder="Digite o nome do produto">
                    </div>
                    <div class="input-group">
                        <label>Descrição:</label>
                        <br>
                        <textarea id="descricao" class="descricao-produto" placeholder="Digite a descrição do produto">
                        </textarea>
                    </div>
                    <div class="input-group">
                        <label>Telefone:</label>
                        <br>
                        <input type="text" id="telefone" required placeholder="Digite o telefone da empresa fornecedora">
                    </div>
                    <div class="input-group">
                        <label>E-mail:</label>
                        <br>
                        <input type="text" id="email" required placeholder="Digite o E-Mail da empresa fornecedora">
                    </div>
                    <div class="input-group">
                        <label>Endereço:</label>
                        <br>
                        <input type="text" id="endereco" required placeholder="Digite o endereço da empresa fornecedora">
                    </div>
                    <div class="input-group">
                        <label>Produto:</label>
                        <br>
                        <input type="text" id="produto" required placeholder="Digite o produto fornecido pela empresa">
                    </div>
                    <div class="input-group">
                        <select id="status" class="status" required>
                            <option value="" selected disabled>
                                Selecione o status
                            </option>
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                        </select>
                    </div>
                    <div class="BTNs">
                        <button class="btn-salvar" type="submit">
                            Salvar Fornecedor
                        </button>
                        <button type="button" class="btn-limpar" onclick="limparFormulario()">
                            Novo
                        </button>
                    </div>
                </form>
            </div>
        </section>
        <section class="listar-produtos">
            <h2 class="h2">Produtos Cadastrados</h2>
            <table border="1" class="tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Código SKU</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Endereço</th>
                        <th>Produto</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela">
                </tbody>
            </table>
        </section>
    </main>
    <script src="/DASHBOARD/JS/produtos.js"></script>
</body>
</html>
