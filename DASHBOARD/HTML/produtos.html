<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos</title>
    <link rel="stylesheet" href="/DASHBOARD/CSS/abas.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="titulo">Cadastro de Produtos</h1>
        <h3 class="descricao">Cadastro Manual de Produtos</h3>
        <button class="BTN_voltar" id="BTN_voltar" type="button" onclick="voltarDashboard()">
            Dashboard
        </button>
    </header>
    <main>
        <section class="cadastro">
            <h2>Dados do Produto</h2>
            <!-- Formulário de Cadastro -->
            
                <form id="formProduto">
                    <input type="hidden" id="id">
                    <div class="grade">
                        <div class="input-group">
                            <label>Nome:</label>
                            <input type="text" id="nome" required placeholder="Digite o nome do produto">
                        </div>
                        <div class="input-group">
                            <label class="label">Descrição:</label>
                            <textarea id="descricao" class="descricao-produto" placeholder="Digite a descrição do produto" ></textarea>
                        </div>
                        <div class="input-group">
                            <label>Categoria:</label>
                            <input type="text" id="categoria" required placeholder="Digite a categoria do produto">
                        </div>
                        <div class="input-group">
                            <label>Marca:</label>
                            <input type="text" id="marca" required placeholder="Digite a marca do produto">
                        </div>
                        <div class="input-group">
                            <label>Fornecedor:</label>
                            <input type="text" id="fornecedor_produto" required placeholder="Digite o fornecedor do produto">
                        </div>
                        <div class="input-group">
                            <label>Preço:</label>
                            <input type="number" min="0" value="0" step="0.01" id="preco" required placeholder="Digite o preço do produto">
                        </div>
                        <div class="input-group">
                            <label>Estoque:</label>
                            <input type="number" id="estoque" required placeholder="Digite o o estoque do produto">
                        </div>
                        <div class="input-group">
                            <label>Status do produto:</label>
                            <select id="status" class="status" required>
                                <option value="" selected disabled>
                                    Selecione o status
                                </option>
                                <option value="disponivel">Disponivel</option>
                                <option value="indisponivel">Indisponivel</option>
                                <option value="descontinuado">Descontinuado</option>
                            </select>
                        </div>
                    </div>
                    <div class="BTNs">
                        <button class="btn-salvar" type="submit">
                            Salvar Produto
                        </button>
                        <button type="button" class="btn-limpar" onclick="limparFormulario()">
                            Novo
                        </button>
                    </div>
                </form>
        </section>
        <section class="listar-produtos">
            <h2 class="h2">Produtos Cadastrados</h2>
            <table border="1" class="tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Categoria</th>
                        <th>Fornecedor</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela">
                </tbody>
            </table>
        </section>
    </main>
    <script src="/DASHBOARD/JS/produtos.js"></script>
</body>
</html>
