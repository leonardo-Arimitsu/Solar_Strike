<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD</title>
</head>
<body>
    <header>
        <h1>Gerenciamento do Sistema</h1>
        <button id="BTN_sair">
            SAIR
        </button>
    </header>
    <main class="dashboard">
        <h2 class="BEM VINDO">
            Seja bem vindo
        </h2>
        <div class="cards">
            <button clss="card" onclick="abrirClientes()">
                <p style="font-size: 80px;">🫂</p>
                <h3>Clientes</h3>
                <p>Cadastro de Gerenciamento</p>
            </button>
            <button class="card">
                <span style="font-size: 80px;">🏢</span>
                <h3>Fornecedores</h3>
                <p>Cadastro de Fornecedores</p>
            </button>
            <button class="card">
                <span style="font-size: 80px;">🧑‍💼</span>
                <h3>Funcionários</h3>
                <p>Cadastro de Funcionários</p>
            </button>
            <button class="card">
                <span style="font-size: 80px;">🪛</span>
                <h3>Manutenção</h3>
                <p>Manutenção de Sistema</p>
            </button>
        </div>
    </main>

    <script type="text/javascript" src="/js/dashboard.js"></script>
</body>
</html>
