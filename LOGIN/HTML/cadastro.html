<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Homo Habilis: Caça e Pesca</title>
    <link rel="stylesheet" href="/LOGIN/CSS/login.css">
</head>
<body>
    <main>
        <div class="login-container">

            <div class="icone">
                <h1>Cadastro</h1>
                <p>Bem-vindo à loja! Por favor, insira suas informações:</p>
            </div>

            <form class="login" id="form-cadastro" novalidate>

                <div class="input-group">

                    <span class="name-label">Nome:</span>

                    <input class="input-login input-name"
                           type="text"
                           id="name"
                           name="name"
                           placeholder="Digite seu nome completo"
                           autocomplete="name"
                           aria-label="Nome completo"
                           required>

                    <span class="email-label">E-mail:</span>

                    <input class="input-login input-email"
                           type="email"
                           id="email"
                           name="email"
                           placeholder="Digite seu E-mail"
                           autocomplete="email"
                           aria-label="E-mail"
                           required>

                    <span class="password-label">Senha:</span>

                    <div class="password-holder input-password-field">

                        <input class="input-password"
                               type="password"
                               id="password"
                               name="password"
                               placeholder="Digite sua Senha"
                               autocomplete="new-password"
                               aria-label="Senha"
                               required>

                        <button type="button"
                                class="toggle-password"
                                aria-label="Mostrar senha"
                                aria-pressed="false">
                            <img src="/Imagens/eye-icon-size_16.png" alt="">
                        </button>

                    </div>

                    <span class="confirm-password-label">Confirme sua Senha:</span>

                    <div class="password-holder input-confirm-field">

                        <input class="input-password"
                               type="password"
                               id="confirm-password"
                               name="confirm-password"
                               placeholder="Confirme sua Senha"
                               autocomplete="new-password"
                               aria-label="Confirmar senha"
                               required>

                        <button type="button"
                                class="toggle-password"
                                aria-label="Mostrar senha"
                                aria-pressed="false">
                            <img src="/Imagens/eye-icon-size_16.png" alt="">
                        </button>

                    </div>

                </div>

                <div class="options">

                    <button class="login-entry"
                            id="btn-cadastrar"
                            type="submit">
                        <span>Criar conta</span>
                    </button>

                    <span class="no-account">
                        Já tem uma conta?
                        <a href="/LOGIN/HTML/index.html">Faça login!</a>
                    </span>

                </div>
            </form>
        </div>
    </main>

</body>
</html>
