<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Homo Habilis: Caça e Pesca</title>
    <link rel="stylesheet" href="/LOGIN/CSS/login.css">
</head>
<body>
    <main>
        <div class="login-container">
            <div class="icone">
                <h1>Login</h1>
                <p>Bem-vindo de volta, acesse sua conta:</p>
            </div>

            <form class="login" id="form-login" novalidate>
                <div class="input-group">
                    <input class="input-login"
                           type="email"
                           id="email"
                           name="email"
                           placeholder="Digite seu E-mail"
                           autocomplete="email"
                           aria-label="E-mail"
                           required>

                    <div class="password-holder">
                        <input class="input-password"
                               type="password"
                               id="password"
                               name="password"
                               placeholder="Digite sua Senha"
                               autocomplete="current-password"
                               aria-label="Senha"
                               required>

                        <button type="button"
                                id="toggle-password"
                                aria-label="Mostrar senha"
                                aria-pressed="false">
                            <img src="/Imagens/eye-icon-size_16.png" alt="">
                        </button>
                    </div>

                    <p class="mensagem-login" id="mensagem-login" role="alert" hidden></p>
                </div>

                <div class="options">
                    <a href="#">Esqueci a Senha!</a>

                    <button class="login-entry" id="btn-entrar" type="submit">
                        <span>Entrar</span>
                    </button>

                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span>Lembre de mim</span>
                    </label>

                    <span class="no-account">Não tem uma conta? <a href="#">Crie uma!</a></span>
                </div>
            </form>
        </div>
    </main>

    <script src="/LOGIN/JS/login.js"></script>
</body>
</html>
